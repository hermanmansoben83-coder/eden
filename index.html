  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;
    const AppContext = createContext();
    const useApp = () => useContext(AppContext);

    const DATA_SCHEMA_VERSION = 6;
    const SESSION_KEY = 'eden_session_v6';
    const STORAGE_KEY = 'eden_cms_pro_v6';

    const defaultData = {
      darkMode: false,
      siteSettings: {
        namaGereja: "JEMAAT EDEN MANSOBEN",
        organisasi: "GKI DI TANAH PAPUA",
        klasis: "KLASIS SUPIORI UTARA",
        alamat: "Waryesi, Supiori Timur, Kabupaten Supiori, Papua",
        telepon: "081243746402",
        whatsapp: "6281243746402",
        email: "info@edenmansoben.org",
        logo: "https://z-cdn-media.chatglm.cn/files/4fabba54-2f26-438b-b40e-398b13caf196.png?auth_key=1889554295-cc7a6a9c56ee486f87310ec34f34e44a-0-f2a1c7614b95bb965c91af1bcef7ef30",
        heroImage: "https://z-cdn-media.chatglm.cn/files/6fdf665f-8a15-42cd-a4ae-c7d2870d3b61.jpg?auth_key=1890418786-9b930747aac1472db316be621631d4a7-0-ed18eb9a9c29ad848d744f24ccb425d7",
        heroSideImage: "https://z-cdn-media.chatglm.cn/files/31d6dce0-f8c7-4745-8bca-621d982cb8ce.jpg?auth_key=1890293815-c35f59220123482a90eb3ec39872731c-0-5a117b0c0a07e257e4e12d1f8e378876"
      },
      news: [], sermons: [], schedules: [], mimbarItems: [],
      greeting: { text: "Selamat datang di website Jemaat Eden Mansoben. Marilah kita bertumbuh dalam iman dan melayani dengan kasih.", name: "Pendeta Jemaat", photoBase64: "" },
      aboutContent: { profil: "Profil gereja belum diisi.", sejarah: "Sejarah gereja belum diisi.", visi: "Visi gereja belum diisi.", misi: "Misi gereja belum diisi." },

    const AppProvider = ({ children }) => {
      const [appData, setAppData] = useState(defaultData);
      const [isLoaded, setIsLoaded] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        const session = sessionStorage.getItem(SESSION_KEY);
        if (session) {
          try {
            const sessData = JSON.parse(atob(session));
            if (sessData.expiry > Date.now()) setIsAdmin(true);
            else sessionStorage.removeItem(SESSION_KEY);
          } catch (e) { sessionStorage.removeItem(SESSION_KEY); }
        }

        localforage.getItem(STORAGE_KEY).then(savedData => {
          if (savedData) {
            // Migrasi Data Lama -> Tanpa Merusak Struktur
            const merged = { ...defaultData, ...savedData };
            if (savedData.mediaCategories) merged.mediaCategories = Array.from(new Set([...defaultData.mediaCategories, ...savedData.mediaCategories]));
            merged.news = (merged.news || []).map(n => ({...n, status: n.status || 'Published', createdAt: n.createdAt || Date.now()}));
            merged.sermons = (merged.sermons || []).map(s => ({...s, createdAt: s.createdAt || Date.now()}));
            merged.schedules = (merged.schedules || []).map(s => ({...s, createdAt: s.createdAt || Date.now()}));
            merged.mimbarItems = (merged.mimbarItems || []).map(m => ({...m, status: m.status || 'Published', createdAt: m.createdAt || Date.now()}));
            merged.albums = (merged.albums || []).map(a => ({...a, createdAt: a.createdAt || Date.now()}));
            merged.mediaItems = (merged.mediaItems || []).map(m => ({...m, createdAt: m.createdAt || Date.now()}));
            setAppData(merged);
          }
          setIsLoaded(true);
          
          const preloader = document.getElementById('preloader');
          if (preloader) {
            preloader.style.opacity = '0';
            setTimeout(() => preloader.style.display = 'none', 500);
          }
        }).catch(err => { console.error(err); setIsLoaded(true); });
      }, []);

      useEffect(() => {
        if (isLoaded) {
          localforage.setItem(STORAGE_KEY, appData).catch(err => console.error("Gagal simpan", err));
          document.documentElement.classList.toggle('dark', appData.darkMode);
        }
      }, [appData, isLoaded]);

      const updateData = (key, value) => setAppData(prev => ({ ...prev, [key]: value }));
      
      const login = (username, password) => {
        const hash = btoa(`${username}:${password}`);
        if (hash === btoa('admin:iar211')) {
          const sess = btoa(JSON.stringify({ user: 'admin', expiry: Date.now() + (60 * 60 * 1000) }));
          sessionStorage.setItem(SESSION_KEY, sess);
          setIsAdmin(true);
          return true;
        }
        return false;
      };

      const logout = () => { sessionStorage.removeItem(SESSION_KEY); setIsAdmin(false); };
      const showToast = (message, type = 'success') => { setToast({ message, type, id: Date.now() }); setTimeout(() => setToast(null), 3000); };

      return <AppContext.Provider value={{ ...appData, isAdmin, login, logout, updateData, setAppData, showToast }}>
        {children}
        {toast && (
          <div className="fixed top-5 right-5 z-[100] toast-enter">
            <div className={`flex items-center gap-3 px-6 py-4 rounded-lg shadow-2xl text-white ${toast.type === 'success' ? 'bg-teal' : toast.type === 'error' ? 'bg-crimson' : 'bg-sky'}`}>
              <Icon name={toast.type === 'success' ? 'check-circle' : toast.type === 'error' ? 'alert-circle' : 'info'} className="w-6 h-6" />
              <span className="font-medium">{toast.message}</span>
            </div>
          </div>
        )}
      </AppContext.Provider>;
    };

    const Icon = ({ name, className }) => {
      useEffect(() => { if (window.lucide) lucide.createIcons(); }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };
    
    const formatDate = (d) => { if (!d) return ""; const m = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des']; const dt = new Date(d); return isNaN(dt) ? d : `${dt.getDate()} ${m[dt.getMonth()]} ${dt.getFullYear()}`; };
    const formatYear = (d) => { if (!d) return ""; const dt = new Date(d); return isNaN(dt) ? "" : dt.getFullYear(); };
    const uid = () => (window.crypto ? crypto.randomUUID() : Date.now() + Math.random().toString(36).substr(2, 9));

    const compressImage = (file, maxWidth = 1280, quality = 0.8) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let canvas = document.createElement('canvas');
            if (img.width > maxWidth) { const scale = maxWidth / img.width; canvas.width = maxWidth; canvas.height = img.height * scale; } 
            else { canvas.width = img.width; canvas.height = img.height; }
            let ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    };

    const FileUploader = ({ onUpload, label, accept = "image/*", className = "" }) => {
      const ref = useRef(null);
      const [fileName, setFileName] = useState("");
      const [isUploading, setIsUploading] = useState(false);
      const handleChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsUploading(true); setFileName(file.name);
        try {
          if (accept.includes("image")) {
            if (file.size > 10 * 1024 * 1024) { alert("Ukuran gambar maksimal 10MB."); return; }
            const compressed = await compressImage(file); onUpload(compressed);
          } else if (accept.includes("video")) {
            if (file.size > 100 * 1024 * 1024) { alert("Ukuran video terlalu besar (Maks 100MB)."); e.target.value = null; return; }
            const objectUrl = URL.createObjectURL(file); onUpload(objectUrl);
          }
        } catch (err) { alert("Gagal mengupload file."); } 
        finally { setIsUploading(false); }
      };
      return (
        <div className={className}>
          <label className="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">{label}</label>
          <button type="button" onClick={() => ref.current.click()} disabled={isUploading} className="w-full px-4 py-3 border border-dashed border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center gap-2 disabled:opacity-50">
            {isUploading ? <Icon name="loader" className="w-5 h-5 animate-spin" /> : <Icon name="upload-cloud" className="w-5 h-5" />}
            {isUploading ? "Memproses..." : (fileName || "Pilih File")}
          </button>
          <input ref={ref} type="file" accept={accept} className="hidden" onChange={handleChange} />
        </div>
      );
    };

    const Navbar = ({ navigate }) => {

            </div>

              <div className="relative group">
                <button className="flex items-center gap-1 text-sm font-medium text-gray-700 dark:text-gray-200 hover:text-primary dark:hover:text-gold">Mimbar <Icon name="chevron-down" className="w-4 h-4" /></button>
                <div className="absolute left-0 mt-2 w-72 bg-white dark:bg-gray-800 shadow-xl rounded-lg border dark:border-gray-700 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 pt-1 grid grid-cols-2 gap-0">
                  {mimbarLinks.map(l => <button key={l.path} onClick={() => navigate(l.path)} className="block w-full text-left px-3 py-3 text-sm text-gray-700 dark:text-gray-200 hover:bg-skyLight dark:hover:bg-gray-700 border-b dark:border-gray-700">{l.name}</button>)}

    const VideoPlayer = ({ src, onClose }) => {
      const videoRef = useRef(null);
      const [playing, setPlaying] = useState(true);
      const [progress, setProgress] = useState(0);
      const [duration, setDuration] = useState(0);
      
      useEffect(() => { return () => { if (src.startsWith('blob:')) URL.revokeObjectURL(src); }; }, [src]);
      const togglePlay = () => { if (videoRef.current) { if (videoRef.current.paused) { videoRef.current.play(); setPlaying(true); } else { videoRef.current.pause(); setPlaying(false); } } };
      const handleTimeUpdate = () => { if (videoRef.current && videoRef.current.duration) setProgress((videoRef.current.currentTime / videoRef.current.duration) * 100); };
      const handleSeek = (e) => { const rect = e.currentTarget.getBoundingClientRect(); const newTime = ((e.clientX - rect.left) / rect.width) * videoRef.current.duration; if (videoRef.current) videoRef.current.currentTime = newTime; };

      return (

        <footer className="bg-primary text-white pt-16 pb-8">
          <div className="container mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8 mb-12">
            <div>
              <div className="flex items-center gap-3 mb-4">
                <img src={siteSettings.logo} className="h-12 w-12 object-contain bg-white rounded-full p-1" alt="Logo GKI" />
                <h4 className="font-bold text-lg">{siteSettings.namaGereja}</h4>
              </div>
              <p className="text-sm text-gray-300">{siteSettings.klasis}</p>
            </div>
            <div>
              <h4 className="font-bold text-gold mb-4 uppercase text-sm">Menu</h4>
              <ul className="space-y-2 text-gray-300 text-sm">
                <li><button onClick={() => navigate('/')} className="hover:text-white">Beranda</button></li>
                <li><button onClick={() => navigate('/berita')} className="hover:text-white">Berita</button></li>
                <li><button onClick={() => navigate('/media/foto')} className="hover:text-white">Galeri Foto</button></li>
              </ul>
            </div>
            <div>
              <h4 className="font-bold text-gold mb-4 uppercase text-sm">Informasi</h4>
              <ul className="space-y-2 text-gray-300 text-sm">
                <li><button onClick={() => navigate('/jadwal')} className="hover:text-white">Jadwal Ibadah</button></li>
                <li><button onClick={() => navigate('/tentang')} className="hover:text-white">Tentang Kami</button></li>
                <li><button onClick={() => navigate('/kontak')} className="hover:text-white">Kontak</button></li>
              </ul>
            </div>
            <div>
              <h4 className="font-bold text-gold mb-4 uppercase text-sm">Kontak</h4>
              <p className="text-sm text-gray-300 mb-2">{siteSettings.alamat}</p>
              <div className="flex gap-4 mt-2">
                <a href={waLink} target="_blank" rel="noopener noreferrer" className="hover:text-gold cursor-pointer"><Icon name="message-circle" className="w-5 h-5 text-gray-300 hover:text-gold"/></a>
                <Icon name="facebook" className="w-5 h-5 text-gray-300 hover:text-gold cursor-pointer"/>
                <Icon name="youtube" className="w-5 h-5 text-gray-300 hover:text-gold cursor-pointer"/>
              </div>
            </div>
          </div>
          <div className="border-t border-white/20 pt-8 text-center text-sm text-gray-400">© {new Date().getFullYear()} {siteSettings.namaGereja} — {siteSettings.organisasi}. All rights reserved.</div>
        </footer>
      );
    };

    const App = () => {
      const [route, setRoute] = useState(window.location.hash.slice(1) || '/');
      const { siteSettings } = useApp();

      useEffect(() => {
        const onHashChange = () => setRoute(window.location.hash.slice(1) || '/');
        window.addEventListener('hashchange', onHashChange);
        lucide.createIcons();
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      useEffect(() => { lucide.createIcons(); }, [route]);

      useEffect(() => {
        document.title = `${siteSettings.namaGereja} | GKI di Tanah Papua`;
      }, [siteSettings]);

      const navigate = (path) => { window.location.hash = path; setRoute(path); window.scrollTo(0, 0); };

      const mimbarMatch = route.match(/^\/mimbar\/(.*)$/);
      const mimbarCategory = mimbarMatch ? mimbarMatch[1] : null;
      const isMediaRoute = route.includes('/media');
      const mediaView = route.includes('/media/') ? route.split('/').pop() : 'all';

      if (route === '/admin' || route === '/login') {
        return route === '/admin' ? <AdminDashboard navigate={navigate} /> : <LoginScreen navigate={navigate} />;
      }

      return (
        <>
          <Navbar navigate={navigate} />
          {route === '/' && (
            <>
              <Hero navigate={navigate} />
              <div className="container mx-auto px-4 py-16">
                <h2 className="text-3xl font-bold text-primary dark:text-white text-center mb-12">Sambutan & Berita Terkini</h2>
                <div className="grid md:grid-cols-3 gap-6">
                  <NewsPage />
                </div>
              </div>
            </>
          )}
          {route === '/tentang' && <AboutPage />}
          {route === '/jadwal' && <SchedulePage />}
          {route === '/khotbah' && <SermonPage />}
          {route === '/berita' && <NewsPage />}
          {mimbarCategory && <MimbarPage navigate={navigate} category={mimbarCategory} />}
          {isMediaRoute && <MediaPage navigate={navigate} initialView={mediaView === 'media' ? 'all' : mediaView} />}
          {route === '/kontak' && <ContactPage />}
          {route !== '/' && !['/tentang', '/jadwal', '/khotbah', '/berita', '/kontak'].includes(route) && !mimbarCategory && !isMediaRoute && (
            <div className="min-h-[50vh] flex flex-col items-center justify-center text-gray-500">
              <Icon name="alert-triangle" className="w-16 h-16 mb-4 text-amber-500" />
              <h2 className="text-2xl font-bold mb-2">404 - Halaman Tidak Ditemukan</h2>
              <button onClick={() => navigate('/')} className="mt-4 text-sky hover:underline">Kembali ke Beranda</button>
            </div>
          )}
          <Footer navigate={navigate} />
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppProvider><App /></AppProvider>);
  </script>
</body>
</html>
